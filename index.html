<!DOCTYPE html>
<html lang="tr" class="theme-dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Arbitraj Radarı — Paribu ⇄ Binance (TL)</title>
<style>
  /* ===== Temalar: değişkenler ===== */
  .theme-dark{
    --bg:#0b1220; --panel:#111a2b; --panel2:#0f1626; --text:#e6edf6;
    --muted:#9fb0ca; --accent:#60a5fa; --border:#17243e;
    --headerStart:#0e172a; --headerEnd:#0b1220;
    --chipBg:#1a243e; --chipBorder:#2a3d64;
  }
  .theme-light{
    --bg:#ffffff; --panel:#f3f6fb; --panel2:#ffffff; --text:#0b1220;
    --muted:#4a5568; --accent:#2563eb; --border:#d7deea;
    --headerStart:#eaf1ff; --headerEnd:#ffffff;
    --chipBg:#eef3ff; --chipBorder:#c8d6f5;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(180deg,var(--headerStart),var(--headerEnd));border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:18px}
  header .sub{color:var(--muted);font-size:12px}

  .controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .ctrl{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px}
  .ctrl label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  .row{display:flex;gap:8px;align-items:center}
  input[type="text"], input[type="number"], select{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px 12px;font-size:14px;outline:none
  }
  input[type="range"]{width:100%}
  .btn{background:var(--accent);color:#091220;border:none;border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}
  .ghost{background:var(--panel);color:var(--text);border:1px solid var(--border)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{display:inline-flex;gap:6px;align-items:center;background:var(--chipBg);border:1px solid var(--chipBorder);border-radius:999px;padding:5px 10px;font-size:12px}
  .chip button{all:unset;cursor:pointer;color:#4f79ff}

  .tableWrap{padding:14px 16px}
  table{width:100%;border-collapse:separate;border-spacing:0 8px}
  thead th{font-size:12px;color:var(--muted);text-align:left;padding:0 12px}
  tbody tr{background:var(--panel2);border:1px solid var(--border)}
  tbody td{padding:12px;font-size:14px}
  tbody tr td:first-child{border-top-left-radius:12px;border-bottom-left-radius:12px}
  tbody tr td:last-child{border-top-right-radius:12px;border-bottom-right-radius:12px}
  .mono{font-variant-numeric:tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}
  .right{text-align:right}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Arbitraj Radarı — Paribu ⇄ Binance (TL)</h1>
    <div class="sub">USDT→TRY: <span id="usdtry" class="mono">—</span> · Son: <span id="last" class="mono">—</span></div>
  </div>
  <div class="sub">İzlenen: <span id="cnt">0</span> · Hata: <span id="err">0</span></div>
</header>

<section class="controls">
  <div class="ctrl">
    <label>Coin Ekle / Çıkar</label>
    <div class="row">
      <input id="coinIn" type="text" placeholder="Örn: ZIL, XAI, MINA"/>
      <button id="add" class="btn">Ekle</button>
      <button id="clear" class="btn ghost">Temizle</button>
    </div>
    <div id="chips" class="chips"></div>
  </div>

  <div class="ctrl">
    <label>Yenileme Aralığı (0.1–4.0 sn)</label>
    <div class="row">
      <input id="rng" type="range" min="100" max="4000" step="100">
      <div class="mono" id="rngLbl">—</div>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px">PyQt5 mantığı korunur; sadece periyot ayarlanır.</div>
  </div>

  <div class="ctrl">
    <label>Min. % Fark (filtre)</label>
    <div class="row">
      <input id="minPct" type="number" step="0.01" min="0" value="0.00"/>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px">Bu eşiği aşmayan satırlar listelenmez.</div>
  </div>

  <div class="ctrl">
    <label>Tema</label>
    <div class="row">
      <select id="themeSel">
        <option value="dark">Koyu</option>
        <option value="light">Açık</option>
      </select>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px">Arka planı beyaz yapmak için “Açık” temayı seç.</div>
  </div>
</section>

<section class="tableWrap">
  <table>
    <thead>
      <tr>
        <th>Coin</th>
        <th>AL</th>
        <th>SAT</th>
        <th class="right">Fark / Yüzde</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <!-- satırlar -->
    </tbody>
  </table>
</section>

<script>
/* ============== Yardımcılar + Kalıcı Hafıza (localStorage) ============== */
const $ = s => document.querySelector(s);
const LS = {
  get(key, def){ try{ const v = localStorage.getItem(key); return v==null ? def : JSON.parse(v); }catch{ return def; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch{} }
};

function norm(sym){
  if(!sym) return '';
  return sym.trim().toUpperCase()
    .replaceAll('İ','I').replaceAll('İ','I')
    .replaceAll('Ç','C').replaceAll('Ğ','G').replaceAll('Ö','O').replaceAll('Ş','S').replaceAll('Ü','U');
}
function fmt(n, d=4){ return (n==null||!isFinite(n)) ? '—' : Number(n).toFixed(d); }
function nowStr(){ return new Date().toLocaleTimeString(); }

/* ================== Durum ================== */
let watched = new Set(LS.get('arbi:watched', [])); // kalıcı
let refreshMs = Number(LS.get('arbi:interval', 1000)); // kalıcı
let minPctFilter = Number(LS.get('arbi:minpct', 0.00)); // kalıcı
let themeMode = LS.get('arbi:theme', 'dark'); // 'dark' | 'light'

let timer = null, updating = false, errors = 0, usdtry = null;

const elUsd = $('#usdtry'), elLast = $('#last'), elCnt = $('#cnt'), elErr = $('#err'),
      elBody = $('#tbody'), elRngLbl = $('#rngLbl'), elRng = $('#rng'), elMin = $('#minPct'),
      elThemeSel = $('#themeSel');

/* ================== Ağ ================== */
function paribuUrl(sym){ return `https://web.paribu.com/market/${sym.toLowerCase()}_tl/orderbook`; }
function binanceUrl(sym){ return `https://api.binance.com/api/v3/ticker/bookTicker?symbol=${sym}USDT`; }

async function jget(url){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
function parseParibu(payload){
  if(!payload || !payload.buy || !payload.sell) return {bid:NaN, ask:NaN};
  const bids = Object.keys(payload.buy).map(parseFloat).filter(x=>!isNaN(x));
  const asks = Object.keys(payload.sell).map(parseFloat).filter(x=>!isNaN(x));
  if(!bids.length || !asks.length) return {bid:NaN, ask:NaN};
  return { bid: Math.max(...bids), ask: Math.min(...asks) }; // PyQt5 ile aynı
}

/* ================== Mantık (PyQt5 ile birebir) ================== */
async function tick(){
  if(updating) return;
  if(watched.size===0){ elBody.innerHTML=''; return; }
  updating = true;
  try{
    // USDTTL (Paribu) — Binance fiyatlarını TL'ye çevirmek için
    try{
      const usdt = await jget(paribuUrl('usdt'));
      const best = parseParibu(usdt.payload);
      if(isFinite(best.bid)) usdtry = best.bid;
      elUsd.textContent = fmt(usdtry, 4);
    }catch(e){ /* önceki usdtry kullanılabilir */ }

    const syms = Array.from(watched);
    const jobs = syms.map(async sym=>{
      const pJson = await jget(paribuUrl(sym));
      const pBest = parseParibu(pJson.payload);

      const bJson = await jget(binanceUrl(sym));
      const bBidUSDT = parseFloat(bJson.bidPrice);
      const bAskUSDT = parseFloat(bJson.askPrice);

      // USDTTL varsa Binance TL'ye çevir, yoksa USDT kalır (PyQt5 davranışı)
      const mul = (usdtry!=null) ? usdtry : 1;
      const bBidTL = bBidUSDT * mul;
      const bAskTL = bAskUSDT * mul;

      // PyQt5 hesapları:
      // diff1 = Paribu_buy - Binance_sell
      // diff2 = Binance_buy - Paribu_sell
      const diff1 = pBest.bid - bAskTL;
      const diff2 = bBidTL - pBest.ask;

      let show=false, low=0, high=0, pct=0, lowSrc='', highSrc='';
      if((diff1>0 || diff2>0) && isFinite(pBest.bid) && isFinite(pBest.ask) && isFinite(bBidTL) && isFinite(bAskTL)){
        show = true;
        if(diff1 > diff2){
          pct = (diff1 / bAskTL) * 100;
          low = bAskTL; high = pBest.bid; lowSrc='Binance'; highSrc='Paribu';
        }else{
          pct = (diff2 / pBest.ask) * 100;
          low = pBest.ask; high = bBidTL; lowSrc='Paribu'; highSrc='Binance';
        }
      }else{
        show = false; // fırsat yoksa satır ekleme
      }

      return {sym, show, low, high, pct, lowSrc, highSrc};
    });

    let rows = await Promise.all(jobs);
    // % eşiği uygula
    rows = rows.filter(r => r.show && isFinite(r.pct) && r.pct >= minPctFilter);
    // Sırala: yüzdeliğe göre azalan
    rows.sort((a,b)=> b.pct - a.pct);
    draw(rows);

    elLast.textContent = nowStr();
  }catch(e){
    errors++; elErr.textContent = errors;
  }finally{
    updating = false;
  }
}

function draw(rows){
  const frag = document.createDocumentFragment();
  rows.forEach(r=>{
    const tr = document.createElement('tr');

    const tdC = document.createElement('td'); tdC.textContent = r.sym; tr.appendChild(tdC);

    // AL (düşük fiyat kaynağına göre renk)
    const tdL = document.createElement('td'); tdL.className='mono';
    tdL.textContent = fmt(r.low,4);
    tdL.style.background = (r.lowSrc==='Binance') ? 'orange' : 'green'; // PyQt5 renklendirme
    tr.appendChild(tdL);

    // SAT (yüksek fiyat)
    const tdH = document.createElement('td'); tdH.className='mono';
    tdH.textContent = fmt(r.high,4);
    tdH.style.background = (r.highSrc==='Paribu') ? 'green' : 'orange'; // PyQt5 renklendirme
    tr.appendChild(tdH);

    const tdP = document.createElement('td'); tdP.className='right mono';
    tdP.textContent = `%${isFinite(r.pct)? r.pct.toFixed(3) : '—'}`;
    tr.appendChild(tdP);

    frag.appendChild(tr);
  });
  elBody.innerHTML = '';
  elBody.appendChild(frag);
}

/* ================== Tema ================== */
function applyTheme(mode){
  const html = document.documentElement;
  html.classList.remove('theme-dark','theme-light');
  html.classList.add(mode==='light' ? 'theme-light' : 'theme-dark');
  elThemeSel.value = (mode==='light' ? 'light' : 'dark');
  LS.set('arbi:theme', (mode==='light' ? 'light' : 'dark'));
}

/* ================== UI / Kontroller (kalıcı) ================== */
function renderChips(){
  const wrap = $('#chips'); wrap.innerHTML='';
  Array.from(watched).sort().forEach(sym=>{
    const d = document.createElement('div'); d.className='chip';
    d.innerHTML = `<span>${sym}</span>`;
    const b = document.createElement('button'); b.textContent='×';
    b.onclick = ()=>{
      watched.delete(sym);
      LS.set('arbi:watched', Array.from(watched)); // kalıcı
      elCnt.textContent = watched.size; renderChips();
    };
    d.appendChild(b); wrap.appendChild(d);
  });
  elCnt.textContent = watched.size;
}

function schedule(ms){
  refreshMs = Math.max(100, Math.min(4000, ms|0));
  elRng.value = refreshMs;
  elRngLbl.textContent = (refreshMs/1000).toFixed(1)+' sn';
  LS.set('arbi:interval', refreshMs); // kalıcı
  if(timer) clearInterval(timer);
  timer = setInterval(tick, refreshMs);
}

/* === Eventler === */
$('#add').onclick = ()=>{
  const raw = $('#coinIn').value;
  const sym = norm(raw);
  if(sym){
    watched.add(sym);
    LS.set('arbi:watched', Array.from(watched)); // kalıcı
    renderChips();
  }
  $('#coinIn').value='';
};
$('#coinIn').addEventListener('keydown',(e)=>{ if(e.key==='Enter') $('#add').click(); });

$('#clear').onclick = ()=>{
  watched.clear();
  LS.set('arbi:watched', []); // kalıcı
  renderChips(); elBody.innerHTML='';
};

elRng.addEventListener('input', e=> schedule(Number(e.target.value)));

elMin.addEventListener('input', e=>{
  minPctFilter = Number(e.target.value)||0;
  LS.set('arbi:minpct', minPctFilter); // kalıcı
});

elThemeSel.addEventListener('change', (e)=> applyTheme(e.target.value));

/* ================== Başlat (kalıcı ayarları yükle) ================== */
(function initFromStorage(){
  // tema
  applyTheme(themeMode);
  // min % eşiği ve slider UI
  elMin.value = isFinite(minPctFilter)? minPctFilter : 0.00;
  renderChips();
  schedule(isFinite(refreshMs) ? refreshMs : 1000);
  // ilk last label
  elLast.textContent = nowStr();
})();
setInterval(()=>{ if(watched.size===0) elLast.textContent = nowStr(); }, 1000);
</script>
</body>
</html>
