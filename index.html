<!DOCTYPE html>
<html lang="tr" class="theme-dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Arbitraj Radarı — Paribu ⇄ Binance (TL)</title>
<style>
  /* ===== Temalar ===== */
  .theme-dark{
    --bg:#0b1220; --panel:#111a2b; --panel2:#0f1626; --text:#e6edf6;
    --muted:#9fb0ca; --accent:#60a5fa; --border:#17243e;
    --headerStart:#0e172a; --headerEnd:#0b1220;
    --chipBg:#1a243e; --chipBorder:#2a3d64;
    --greenBg:#0f2a1b; --greenBd:#184a2b; --greenTx:#b6f7c8;
  }
  .theme-light{
    --bg:#ffffff; --panel:#f3f6fb; --panel2:#ffffff; --text:#0b1220;
    --muted:#4a5568; --accent:#2563eb; --border:#d7deea;
    --headerStart:#eaf1ff; --headerEnd:#ffffff;
    --chipBg:#eef3ff; --chipBorder:#c8d6f5;
    --greenBg:#e9f8ef; --greenBd:#b9e5c8; --greenTx:#166534;
  }

  :root{
    --table-font:18px;
    --cell-pad-y:12px;
    --cell-pad-x:10px;
    --row-gap:6px;
    --cell-radius:12px;
    --container-max:1100px;
    --col-coin:28%;
    --col-al:27%;
    --col-sat:27%;
    --col-pct:18%;
    --card-font:22px;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(180deg,var(--headerStart),var(--headerEnd));border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:20px}
  header .sub{color:var(--muted);font-size:12px}
  header .rightBox{display:flex;gap:14px;align-items:center}
  .btn{background:var(--accent);color:#091220;border:none;border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}
  .ghost{background:var(--panel);color:var(--text);border:1px solid var(--border)}

  .hiWrap{padding:10px 16px}
  .hidden{display:none}
  .hiLine{
    font-size:var(--card-font);font-weight:800;letter-spacing:.2px;
    background:var(--panel2);border:1px solid var(--border);
    border-left:6px solid #22c55e;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap
  }
  .hiGreen{background:var(--greenBg);border:1px solid var(--greenBd);color:var(--greenTx);
    border-radius:999px;padding:4px 10px;font-weight:800}

  .controls{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:12px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .ctrl{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px}
  .ctrl label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  .row{display:flex;gap:8px;align-items:center}
  input[type="text"], input[type="number"], select{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px 12px;font-size:14px;outline:none
  }
  input[type="range"]{width:100%}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{display:inline-flex;gap:6px;align-items:center;background:var(--chipBg);border:1px solid var(--chipBorder);border-radius:999px;padding:5px 10px;font-size:12px}
  .chip button{all:unset;cursor:pointer;color:#4f79ff}

  .tableWrap{padding:12px 16px;max-width:var(--container-max);margin:0 auto}
  table{width:100%;border-collapse:separate;border-spacing:0 var(--row-gap);table-layout:fixed}
  thead th{font-size:calc(var(--table-font) - 4px);color:var(--muted);text-align:center;padding:0 8px}
  thead th:first-child{text-align:left}
  tbody tr{background:var(--panel2);border:1px solid var(--border)}
  tbody td{padding:var(--cell-pad-y) var(--cell-pad-x);font-size:var(--table-font)}
  tbody tr td:first-child{border-top-left-radius:var(--cell-radius);border-bottom-left-radius:var(--cell-radius)}
  tbody tr td:last-child{border-top-right-radius:var(--cell-radius);border-bottom-right-radius:var(--cell-radius)}
  .mono{font-variant-numeric:tabular-nums; font-family: ui-monospace, monospace}
  .muted{color:var(--muted)}
  .coinCell{display:flex;align-items:center;gap:10px}
  .coinSym{font-weight:800}
  .alCell,.satCell,.pctCell{text-align:center;font-weight:800}

  /* KİŞİSELLEŞTİR paneli */
  .customWrap{padding:10px 16px}
  .customPanel{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px;display:grid;gap:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .rowLabel{font-size:12px;color:var(--muted);margin-bottom:4px}
  .kv{display:flex;align-items:center;gap:8px}
  .kv .val{font-size:12px;color:var(--muted);min-width:48px;text-align:right}
  .footerBtns{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<header>
  <div>
    <h1>Arbitraj Radarı</h1>
    <div class="sub">
      <span id="usdBox">USDT→TRY: <span id="usdtry" class="mono">—</span></span>
      · Son: <span id="last" class="mono">—</span>
    </div>
  </div>
  <div class="rightBox">
    <div id="btcBox" class="sub">BTCUSDT: <span id="btc" class="mono">—</span></div>
    <button id="toggleHi" class="btn ghost">Fark Kartı</button>
    <button id="toggleCustom" class="btn ghost">Ayarlar</button>
    <div class="sub">İzlenen: <span id="cnt">0</span> · Hata: <span id="err">0</span></div>
  </div>
</header>

<div id="anchorTop"></div>

<section id="hiWrap" class="hiWrap">
  <div class="hiLine">
    <span id="hiCoin">—</span>
    <span class="hiGreen" id="hiAct">PARİBU • —</span>
    <span id="hiPrice" class="mono">—</span>
    <span id="hiPct" class="mono">—</span>
  </div>
</section>

<section class="controls">
  <div class="ctrl">
    <label>Coin Ekle (Örn: BTC, ETH)</label>
    <div class="row">
      <input id="coinIn" type="text" placeholder="Sembol..."/>
      <button id="add" class="btn">Ekle</button>
      <button id="clear" class="btn ghost">Temizle</button>
    </div>
    <div id="chips" class="chips"></div>
  </div>

  <div class="ctrl">
    <label>Yenileme (sn)</label>
    <div class="row">
      <input id="rng" type="range" min="500" max="10000" step="500">
      <div class="mono" id="rngLbl">—</div>
    </div>
  </div>

  <div class="ctrl">
    <label>Min. % Fark</label>
    <input id="minPct" type="number" step="0.01" value="0.00"/>
  </div>

  <div class="ctrl">
    <label>Tema</label>
    <select id="themeSel">
      <option value="dark">Koyu</option>
      <option value="light">Açık</option>
    </select>
  </div>
</section>

<section id="customWrap" class="customWrap hidden">
  <div class="customPanel">
    <div class="grid3">
        <div><div class="rowLabel">Yazı Boyutu</div><input id="ui_tableFont" type="range" min="12" max="24"><span id="ui_tableFont_val"></span></div>
        <div><div class="rowLabel">Genişlik</div><input id="ui_maxW" type="range" min="600" max="1400"><span id="ui_maxW_val"></span></div>
        <div><div class="rowLabel">Konum</div><select id="ui_hiPos"><option value="top">Üst</option><option value="hidden">Gizli</option></select></div>
    </div>
    <div class="footerBtns"><button id="ui_reset" class="btn ghost">Sıfırla</button></div>
  </div>
</section>

<div id="anchorAfterControls"></div>

<section class="tableWrap">
  <table>
    <colgroup>
      <col style="width:var(--col-coin);">
      <col style="width:var(--col-al);">
      <col style="width:var(--col-sat);">
      <col style="width:var(--col-pct);">
    </colgroup>
    <thead>
      <tr>
        <th style="text-align:left">Coin</th>
        <th>AL (Ucuz)</th>
        <th>SAT (Pahalı)</th>
        <th>% Fark</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</section>

<div id="anchorAfterTable"></div>

<script>
const $ = s => document.querySelector(s);
const LS = {
  get(key, def){ try{ let v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch{ return def; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch{} }
};

/* CORS Sorununu Çözen Fonksiyon */
async function jget(url) {
  // Paribu isteklerini proxy üzerinden geçiriyoruz
  const proxyUrl = url.includes('paribu') ? `https://corsproxy.io/?${encodeURIComponent(url)}` : url;
  const res = await fetch(proxyUrl, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function norm(s){ return s?.trim().toUpperCase().replace(/İ/g,'I').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ş/g,'S').replace(/Ö/g,'O').replace(/Ç/g,'C') || ''; }
function fmtFixedTR(n, d=2){ return isFinite(n) ? n.toLocaleString('tr-TR',{minimumFractionDigits:d, maximumFractionDigits:d}) : '—'; }
function fmtPctTR(n, d=2){ return isFinite(n) ? '%' + fmtFixedTR(n, d) : '—'; }
function nowStr(){ return new Date().toLocaleTimeString('tr-TR'); }

let watched = new Set(LS.get('arbi:watched', ['BTC', 'ETH', 'SOL', 'USDT']));
let refreshMs = Number(LS.get('arbi:interval', 3000));
let minPctFilter = Number(LS.get('arbi:minpct', 0.00));
let themeMode = LS.get('arbi:theme', 'dark');
let UI = LS.get('arbi:UI', { tableFont:16, maxW:1100, hiPos:'top', col:{coin:25, al:25, sat:25, pct:25} });
let usdtry = 1, updating = false, errors = 0;

async function tick() {
  if(updating) return;
  updating = true;
  try {
    // 1. USDT TRY Kurunu Al (Paribu)
    try {
        const uRes = await jget(`https://web.paribu.com/market/usdt_tl/orderbook`);
        const bids = Object.keys(uRes.payload.buy).map(parseFloat);
        if(bids.length) {
            usdtry = Math.max(...bids);
            $('#usdtry').textContent = fmtFixedTR(usdtry, 3);
        }
    } catch(e) { console.error("Kur hatası", e); }

    // 2. Binance BTC
    try {
        const btcRes = await jget('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
        $('#btc').textContent = fmtFixedTR(parseFloat(btcRes.price), 2);
    } catch(e) {}

    // 3. İzlenenleri tara
    const results = [];
    const syms = Array.from(watched);
    
    await Promise.all(syms.map(async sym => {
        try {
            const [pData, bData] = await Promise.all([
                jget(`https://web.paribu.com/market/${sym.toLowerCase()}_tl/orderbook`),
                jget(`https://api.binance.com/api/v3/ticker/bookTicker?symbol=${sym}USDT`)
            ]);

            const pBids = Object.keys(pData.payload.buy).map(parseFloat);
            const pAsks = Object.keys(pData.payload.sell).map(parseFloat);
            const pBid = Math.max(...pBids);
            const pAsk = Math.min(...pAsks);

            const bBidTL = parseFloat(bData.bidPrice) * usdtry;
            const bAskTL = parseFloat(bData.askPrice) * usdtry;

            // Kar senaryoları
            const d1 = ((pBid - bAskTL) / bAskTL) * 100; // Binance Al -> Paribu Sat
            const d2 = ((bBidTL - pAsk) / pAsk) * 100;   // Paribu Al -> Binance Sat

            if (d1 > d2) {
                results.push({ sym, low: bAskTL, high: pBid, pct: d1, buy: 'Binance', sell: 'Paribu' });
            } else {
                results.push({ sym, low: pAsk, high: bBidTL, pct: d2, buy: 'Paribu', sell: 'Binance' });
            }
        } catch(e) { console.warn(sym, "çekilemedi"); }
    }));

    const filtered = results.filter(r => r.pct >= minPctFilter).sort((a,b) => b.pct - a.pct);
    render(filtered);
    $('#last').textContent = nowStr();
  } catch(e) {
    errors++; $('#err').textContent = errors;
  } finally {
    updating = false;
  }
}

function render(rows) {
    const tbody = $('#tbody');
    tbody.innerHTML = '';
    rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><b class="coinSym">${r.sym}</b></td>
            <td class="mono" style="color:#fbbf24">${fmtFixedTR(r.low, 3)}<br><small>${r.buy}</small></td>
            <td class="mono" style="color:#4ade80">${fmtFixedTR(r.high, 3)}<br><small>${r.sell}</small></td>
            <td class="mono pctCell" style="color:${r.pct > 0 ? '#4ade80' : '#f87171'}">${fmtPctTR(r.pct)}</td>
        `;
        tbody.appendChild(tr);
    });

    if(rows.length > 0) {
        const top = rows[0];
        $('#hiCoin').textContent = top.sym;
        $('#hiAct').textContent = `${top.buy} ➔ ${top.sell}`;
        $('#hiPrice').textContent = fmtFixedTR(top.high, 2) + " TL";
        $('#hiPct').textContent = fmtPctTR(top.pct);
    }
}

/* Event Listeners */
$('#add').onclick = () => {
    const val = norm($('#coinIn').value);
    if(val) { watched.add(val); LS.set('arbi:watched', [...watched]); renderChips(); tick(); }
    $('#coinIn').value = '';
};

function renderChips() {
    const box = $('#chips'); box.innerHTML = '';
    watched.forEach(s => {
        const span = document.createElement('div'); span.className = 'chip';
        span.innerHTML = `${s} <button onclick="removeCoin('${s}')">×</button>`;
        box.appendChild(span);
    });
    $('#cnt').textContent = watched.size;
}

window.removeCoin = (s) => {
    watched.delete(s); LS.set('arbi:watched', [...watched]); renderChips();
};

$('#rng').oninput = (e) => {
    refreshMs = e.target.value;
    $('#rngLbl').textContent = (refreshMs/1000).toFixed(1) + " sn";
    LS.set('arbi:interval', refreshMs);
    clearInterval(window.timer);
    window.timer = setInterval(tick, refreshMs);
};

$('#themeSel').onchange = (e) => {
    document.documentElement.className = 'theme-' + e.target.value;
    LS.set('arbi:theme', e.target.value);
};

/* Başlat */
renderChips();
$('#rng').value = refreshMs;
$('#rngLbl').textContent = (refreshMs/1000).toFixed(1) + " sn";
$('#themeSel').value = themeMode;
document.documentElement.className = 'theme-' + themeMode;
window.timer = setInterval(tick, refreshMs);
tick();
</script>
</body>
</html>
