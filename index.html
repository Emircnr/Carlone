<!DOCTYPE html>
<html lang="tr" class="theme-dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Arbitraj Radarı — Paribu ⇄ Binance (Stable v3)</title>
<style>
  .theme-dark{
    --bg:#0b1220; --panel:#111a2b; --panel2:#0f1626; --text:#e6edf6;
    --muted:#9fb0ca; --accent:#60a5fa; --border:#17243e;
    --headerStart:#0e172a; --headerEnd:#0b1220;
    --chipBg:#1a243e; --chipBorder:#2a3d64;
    --greenBg:#0f2a1b; --greenBd:#184a2b; --greenTx:#b6f7c8;
  }
  .theme-light{
    --bg:#ffffff; --panel:#f3f6fb; --panel2:#ffffff; --text:#0b1220;
    --muted:#4a5568; --accent:#2563eb; --border:#d7deea;
    --headerStart:#eaf1ff; --headerEnd:#ffffff;
    --chipBg:#eef3ff; --chipBorder:#c8d6f5;
    --greenBg:#e9f8ef; --greenBd:#b9e5c8; --greenTx:#166534;
  }
  :root{
    --table-font:18px; --cell-pad-y:12px; --cell-pad-x:10px; --row-gap:6px;
    --cell-radius:12px; --container-max:1100px;
    --col-coin:28%; --col-al:27%; --col-sat:27%; --col-pct:18%; --card-font:22px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(180deg,var(--headerStart),var(--headerEnd));border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
  header h1{margin:0;font-size:18px}
  header .sub{color:var(--muted);font-size:12px}
  header .rightBox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--accent);color:#091220;border:none;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:13px}
  .ghost{background:var(--panel);color:var(--text);border:1px solid var(--border)}
  .wsStatus{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:600;transition:all 0.3s}
  .wsStatus.connected{background:#22c55e;color:#000}
  .wsStatus.disconnected{background:#ef4444;color:#fff}
  .wsStatus.connecting{background:#f59e0b;color:#000}
  .hiWrap{padding:10px 16px}
  .hidden{display:none}
  .hiLine{font-size:var(--card-font);font-weight:800;letter-spacing:.2px;background:var(--panel2);border:1px solid var(--border);border-left:6px solid #22c55e;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .hiGreen{background:var(--greenBg);border:1px solid var(--greenBd);color:var(--greenTx);border-radius:999px;padding:4px 10px;font-weight:800}
  .controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  @media(max-width:900px){.controls{grid-template-columns:1fr 1fr}}
  @media(max-width:500px){.controls{grid-template-columns:1fr}}
  .ctrl{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px}
  .ctrl label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  .row{display:flex;gap:8px;align-items:center}
  input[type="text"],input[type="number"],select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{display:inline-flex;gap:6px;align-items:center;background:var(--chipBg);border:1px solid var(--chipBorder);border-radius:999px;padding:5px 10px;font-size:12px}
  .chip button{all:unset;cursor:pointer;color:#4f79ff}
  .tableWrap{padding:12px 16px;max-width:var(--container-max);margin:0 auto}
  table{width:100%;border-collapse:separate;border-spacing:0 var(--row-gap);table-layout:fixed}
  thead th{font-size:calc(var(--table-font) - 4px);color:var(--muted);text-align:center;padding:0 8px}
  thead th:first-child{text-align:left}
  tbody tr{background:var(--panel2);border:1px solid var(--border)}
  tbody td{padding:var(--cell-pad-y) var(--cell-pad-x);font-size:var(--table-font)}
  tbody tr td:first-child{border-top-left-radius:var(--cell-radius);border-bottom-left-radius:var(--cell-radius)}
  tbody tr td:last-child{border-top-right-radius:var(--cell-radius);border-bottom-right-radius:var(--cell-radius)}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
  .muted{color:var(--muted)}
  .coinCell{display:flex;align-items:center;gap:10px}
  .coinSym{font-weight:800}
  .alCell,.satCell,.pctCell{text-align:center;font-weight:800}
  .logBox{background:var(--panel2);border:1px solid var(--border);border-radius:8px;margin:10px 16px;padding:10px;font-size:11px;max-height:150px;overflow-y:auto;font-family:monospace;color:var(--muted)}
  .logBox .error{color:#ef4444}
  .logBox .success{color:#22c55e}
  .logBox .warn{color:#f59e0b}
</style>
</head>
<body>
<header>
  <div>
    <h1>Arbitraj Radarı — Paribu ⇄ Binance (Stable)</h1>
    <div class="sub">
      <span>USDT/TRY: <span id="usdtry" class="mono">—</span></span>
      · Son: <span id="last" class="mono">—</span>
      · <span id="updateCount" class="mono">0</span>/sn
      · Uptime: <span id="uptime" class="mono">0s</span>
    </div>
  </div>
  <div class="rightBox">
    <span id="wsParibu" class="wsStatus disconnected">Paribu: ○</span>
    <span id="wsBinance" class="wsStatus disconnected">Binance: ○</span>
    <button id="reconnect" class="btn ghost">Yeniden Bağlan</button>
    <div class="sub">İzlenen: <span id="cnt">0</span></div>
  </div>
</header>
<div id="logBox" class="logBox"></div>
<section id="hiWrap" class="hiWrap">
  <div class="hiLine">
    <span id="hiCoin">—</span>
    <span class="hiGreen" id="hiAct">— • —</span>
    <span id="hiPrice" class="mono">—</span>
    <span id="hiPct" class="mono">—</span>
  </div>
</section>
<section class="controls">
  <div class="ctrl">
    <label>Coin Ekle / Çıkar</label>
    <div class="row">
      <input id="coinIn" type="text" placeholder="Örn: BTC, ETH, XRP"/>
      <button id="add" class="btn">Ekle</button>
      <button id="clear" class="btn ghost">Temizle</button>
    </div>
    <div id="chips" class="chips"></div>
  </div>
  <div class="ctrl">
    <label>Min. % Fark (filtre)</label>
    <div class="row">
      <input id="minPct" type="number" step="0.01" min="0" value="0.00"/>
    </div>
  </div>
  <div class="ctrl">
    <label>Güncelleme Hızı (Paribu)</label>
    <div class="row">
      <select id="speedSel">
        <option value="100">100ms (En Hızlı)</option>
        <option value="500">500ms</option>
        <option value="1000" selected>1000ms</option>
      </select>
    </div>
  </div>
  <div class="ctrl">
    <label>Tema</label>
    <div class="row">
      <select id="themeSel">
        <option value="dark">Koyu</option>
        <option value="light">Açık</option>
      </select>
    </div>
  </div>
</section>
<section class="tableWrap">
  <table>
    <colgroup>
      <col style="width:var(--col-coin);"><col style="width:var(--col-al);"><col style="width:var(--col-sat);"><col style="width:var(--col-pct);">
    </colgroup>
    <thead><tr><th style="text-align:left">Coin</th><th>AL (Düşük)</th><th>SAT (Yüksek)</th><th>% Fark</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</section>
<script>
const $ = s => document.querySelector(s);
const LS = {
  get(key, def){ try{ return JSON.parse(localStorage.getItem(key)) ?? def; }catch{ return def; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch{} }
};

// ====== LOGGING ======
const logBox = $('#logBox');
function log(msg, type = 'info') {
  const time = new Date().toLocaleTimeString('tr-TR');
  const div = document.createElement('div');
  div.className = type;
  div.textContent = `[${time}] ${msg}`;
  logBox.appendChild(div);
  logBox.scrollTop = logBox.scrollHeight;
  // Max 100 satır tut
  while (logBox.children.length > 100) {
    logBox.removeChild(logBox.firstChild);
  }
  console.log(`[${type}] ${msg}`);
}

// ====== STATE ======
let watched = new Set(LS.get('arbi:watched', ['BTC','ETH','XRP']));
let subscribedParibu = new Set(); // Şu an subscribe olan coinler
let subscribedBinance = new Set();
let minPctFilter = Number(LS.get('arbi:minpct', 0));
let themeMode = LS.get('arbi:theme', 'dark');
let updateSpeed = LS.get('arbi:speed', '100');
let startTime = Date.now();

// Price data
const priceData = {};
let usdtTryBid = null;
let updateCounter = 0;

// ====== WebSocket State ======
let wsParibu = null;
let wsBinance = null;

// Connection state
const wsState = {
  paribu: { connected: false, connecting: false, reconnectTimer: null, attempts: 0 },
  binance: { connected: false, connecting: false, reconnectTimer: null, attempts: 0 }
};

const MAX_ATTEMPTS = 5;
const RECONNECT_DELAYS = [100, 500, 1000, 2000, 5000]; // Exponential backoff

function norm(sym){
  if(!sym) return '';
  return sym.trim().toUpperCase().replace(/İ/g,'I').replace(/[ÇĞÖŞÜ]/g,c=>({Ç:'C',Ğ:'G',Ö:'O',Ş:'S',Ü:'U'}[c]||c));
}

function fmtTR(n, d=2){ return n==null||!isFinite(n)?'—':Number(n).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtPct(n){ return n==null||!isFinite(n)?'—':'%'+fmtTR(n,2); }
function fmt4(n){ return n==null||!isFinite(n)?'—':Number(n).toFixed(4); }
function nowStr(){ return new Date().toLocaleTimeString('tr-TR'); }

function updateStatusUI(type, status) {
  const el = type === 'paribu' ? $('#wsParibu') : $('#wsBinance');
  const name = type === 'paribu' ? 'Paribu' : 'Binance';
  
  el.className = 'wsStatus ' + status;
  if (status === 'connected') {
    el.textContent = name + ': ●';
  } else if (status === 'connecting') {
    el.textContent = name + ': ...';
  } else {
    el.textContent = name + ': ○';
  }
}

// ====== PARIBU WebSocket ======
function connectParibu() {
  if (wsState.paribu.connecting) {
    log('Paribu zaten bağlanıyor, atlanıyor...', 'warn');
    return;
  }
  
  if (wsState.paribu.connected && wsParibu?.readyState === WebSocket.OPEN) {
    log('Paribu zaten bağlı', 'info');
    return;
  }
  
  const symbols = Array.from(watched);
  if (symbols.length === 0) {
    log('İzlenecek coin yok', 'warn');
    updateStatusUI('paribu', 'disconnected');
    return;
  }
  
  // Önceki bağlantıyı temizle
  cleanupParibu();
  
  wsState.paribu.connecting = true;
  updateStatusUI('paribu', 'connecting');
  log('Paribu bağlantısı başlatılıyor...');
  
  try {
    wsParibu = new WebSocket('wss://stream.paribu.com');
    
    wsParibu.onopen = () => {
      wsState.paribu.connected = true;
      wsState.paribu.connecting = false;
      wsState.paribu.attempts = 0;
      updateStatusUI('paribu', 'connected');
      log('Paribu bağlandı ✓', 'success');
      
      // Subscribe
      subscribeParibu(symbols);
    };
    
    wsParibu.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        
        // Subscription response
        if (msg.status !== undefined) {
          if (msg.status === 100) {
            // Başarılı
          } else {
            log(`Paribu subscription hatası: ${JSON.stringify(msg)}`, 'error');
          }
          return;
        }
        
        // Orderbook data
        if (msg.e === 'orderbook' && msg.r) {
          const market = msg.s;
          const bids = msg.r.b;
          const asks = msg.r.a;
          
          if (market === 'usdt_tl') {
            if (bids && bids[0]) {
              usdtTryBid = parseFloat(bids[0][0]);
              $('#usdtry').textContent = fmtTR(usdtTryBid, 4);
            }
          } else {
            const sym = market.replace('_tl','').toUpperCase();
            if (!priceData[sym]) priceData[sym] = {};
            if (bids && bids[0]) priceData[sym].paribuBid = parseFloat(bids[0][0]);
            if (asks && asks[0]) priceData[sym].paribuAsk = parseFloat(asks[0][0]);
          }
          
          updateCounter++;
          scheduleRender();
        }
      } catch(err) {
        log(`Paribu mesaj parse hatası: ${err.message}`, 'error');
      }
    };
    
    wsParibu.onclose = (e) => {
      const wasConnected = wsState.paribu.connected;
      wsState.paribu.connected = false;
      wsState.paribu.connecting = false;
      subscribedParibu.clear();
      updateStatusUI('paribu', 'disconnected');
      
      if (wasConnected) {
        log(`Paribu bağlantısı kapandı (code: ${e.code}, reason: ${e.reason || 'yok'})`, 'warn');
      }
      
      // Reconnect
      scheduleReconnect('paribu');
    };
    
    wsParibu.onerror = (err) => {
      log('Paribu WebSocket hatası', 'error');
      wsState.paribu.connecting = false;
    };
    
  } catch(err) {
    log(`Paribu bağlantı hatası: ${err.message}`, 'error');
    wsState.paribu.connecting = false;
    updateStatusUI('paribu', 'disconnected');
    scheduleReconnect('paribu');
  }
}

function cleanupParibu() {
  if (wsParibu) {
    wsParibu.onopen = null;
    wsParibu.onclose = null;
    wsParibu.onerror = null;
    wsParibu.onmessage = null;
    if (wsParibu.readyState === WebSocket.OPEN || wsParibu.readyState === WebSocket.CONNECTING) {
      try { wsParibu.close(); } catch(e) {}
    }
    wsParibu = null;
  }
  wsState.paribu.connected = false;
  wsState.paribu.connecting = false;
  subscribedParibu.clear();
}

function subscribeParibu(symbols) {
  if (!wsParibu || wsParibu.readyState !== WebSocket.OPEN) {
    log('Paribu subscribe başarısız: bağlantı yok', 'error');
    return;
  }
  
  const channels = symbols.map(s => `orderbook:${s.toLowerCase()}_tl@${updateSpeed}ms`);
  channels.push(`orderbook:usdt_tl@${updateSpeed}ms`);
  
  const msg = {
    method: 'subscribe',
    channels: channels,
    id: 'sub_' + Date.now()
  };
  
  wsParibu.send(JSON.stringify(msg));
  symbols.forEach(s => subscribedParibu.add(s));
  log(`Paribu subscribe: ${symbols.join(', ')} + USDT (${updateSpeed}ms)`);
}

function unsubscribeParibu(symbols) {
  if (!wsParibu || wsParibu.readyState !== WebSocket.OPEN) return;
  
  const channels = symbols.map(s => `orderbook:${s.toLowerCase()}_tl@${updateSpeed}ms`);
  
  const msg = {
    method: 'unsubscribe',
    channels: channels,
    id: 'unsub_' + Date.now()
  };
  
  wsParibu.send(JSON.stringify(msg));
  symbols.forEach(s => subscribedParibu.delete(s));
  log(`Paribu unsubscribe: ${symbols.join(', ')}`);
}

// ====== BINANCE WebSocket ======
function connectBinance() {
  if (wsState.binance.connecting) {
    log('Binance zaten bağlanıyor, atlanıyor...', 'warn');
    return;
  }
  
  if (wsState.binance.connected && wsBinance?.readyState === WebSocket.OPEN) {
    log('Binance zaten bağlı', 'info');
    return;
  }
  
  const symbols = Array.from(watched);
  if (symbols.length === 0) {
    log('İzlenecek coin yok', 'warn');
    updateStatusUI('binance', 'disconnected');
    return;
  }
  
  cleanupBinance();
  
  wsState.binance.connecting = true;
  updateStatusUI('binance', 'connecting');
  log('Binance bağlantısı başlatılıyor...');
  
  // Binance combined stream - tek bağlantıda tüm coinler
  const streams = symbols.map(s => `${s.toLowerCase()}usdt@bookTicker`);
  streams.push('usdttry@bookTicker');
  const url = `wss://stream.binance.com:9443/stream?streams=${streams.join('/')}`;
  
  try {
    wsBinance = new WebSocket(url);
    
    wsBinance.onopen = () => {
      wsState.binance.connected = true;
      wsState.binance.connecting = false;
      wsState.binance.attempts = 0;
      subscribedBinance = new Set(symbols);
      updateStatusUI('binance', 'connected');
      log('Binance bağlandı ✓', 'success');
    };
    
    wsBinance.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (!msg.stream || !msg.data) return;
        
        const data = msg.data;
        
        // bookTicker format: {s: symbol, b: bidPrice, B: bidQty, a: askPrice, A: askQty}
        const symbol = data.s; // BTCUSDT veya USDTTRY
        
        if (symbol === 'USDTTRY') {
          // Bu da bir USDT/TRY kaynağı olabilir
        } else if (symbol && symbol.endsWith('USDT')) {
          const sym = symbol.replace('USDT', '');
          if (!priceData[sym]) priceData[sym] = {};
          priceData[sym].binanceBid = parseFloat(data.b);
          priceData[sym].binanceAsk = parseFloat(data.a);
          updateCounter++;
          scheduleRender();
        }
      } catch(err) {}
    };
    
    wsBinance.onclose = (e) => {
      const wasConnected = wsState.binance.connected;
      wsState.binance.connected = false;
      wsState.binance.connecting = false;
      subscribedBinance.clear();
      updateStatusUI('binance', 'disconnected');
      
      if (wasConnected) {
        log(`Binance bağlantısı kapandı (code: ${e.code})`, 'warn');
      }
      
      scheduleReconnect('binance');
    };
    
    wsBinance.onerror = (err) => {
      log('Binance WebSocket hatası', 'error');
      wsState.binance.connecting = false;
    };
    
  } catch(err) {
    log(`Binance bağlantı hatası: ${err.message}`, 'error');
    wsState.binance.connecting = false;
    updateStatusUI('binance', 'disconnected');
    scheduleReconnect('binance');
  }
}

function cleanupBinance() {
  if (wsBinance) {
    wsBinance.onopen = null;
    wsBinance.onclose = null;
    wsBinance.onerror = null;
    wsBinance.onmessage = null;
    if (wsBinance.readyState === WebSocket.OPEN || wsBinance.readyState === WebSocket.CONNECTING) {
      try { wsBinance.close(); } catch(e) {}
    }
    wsBinance = null;
  }
  wsState.binance.connected = false;
  wsState.binance.connecting = false;
  subscribedBinance.clear();
}

// ====== RECONNECT LOGIC ======
function scheduleReconnect(type) {
  const state = wsState[type];
  
  // Önceki timer'ı temizle
  if (state.reconnectTimer) {
    clearTimeout(state.reconnectTimer);
    state.reconnectTimer = null;
  }
  
  if (state.attempts >= MAX_ATTEMPTS) {
    log(`${type} max reconnect denemesi aşıldı (${MAX_ATTEMPTS}). Manuel bağlantı gerekli.`, 'error');
    return;
  }
  
  const delay = RECONNECT_DELAYS[Math.min(state.attempts, RECONNECT_DELAYS.length - 1)];
  state.attempts++;
  
  log(`${type} reconnect ${delay}ms sonra (deneme ${state.attempts}/${MAX_ATTEMPTS})...`);
  
  state.reconnectTimer = setTimeout(() => {
    if (type === 'paribu') {
      connectParibu();
    } else {
      connectBinance();
    }
  }, delay);
}

// ====== Coin ekleme/çıkarma - BAĞLANTIYI KESMEDEN ======
function addCoin(sym) {
  if (watched.has(sym)) return false;
  
  watched.add(sym);
  LS.set('arbi:watched', [...watched]);
  
  // Paribu: mevcut bağlantıya subscribe ekle
  if (wsState.paribu.connected && wsParibu?.readyState === WebSocket.OPEN) {
    subscribeParibu([sym]);
  }
  
  // Binance: maalesef yeni stream için reconnect gerekli
  // Binance combined stream URL'de belirlendiği için
  if (wsState.binance.connected) {
    log('Binance yeni coin için yeniden bağlanıyor...', 'warn');
    cleanupBinance();
    setTimeout(() => connectBinance(), 100);
  }
  
  return true;
}

function removeCoin(sym) {
  if (!watched.has(sym)) return false;
  
  watched.delete(sym);
  delete priceData[sym];
  LS.set('arbi:watched', [...watched]);
  
  // Paribu: unsubscribe
  if (wsState.paribu.connected && wsParibu?.readyState === WebSocket.OPEN) {
    unsubscribeParibu([sym]);
  }
  
  // Binance: reconnect gerekli (stream URL değişiyor)
  if (wsState.binance.connected) {
    log('Binance coin silme için yeniden bağlanıyor...', 'warn');
    cleanupBinance();
    setTimeout(() => connectBinance(), 100);
  }
  
  return true;
}

// ====== Render ======
let renderScheduled = false;
function scheduleRender() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => {
    renderScheduled = false;
    render();
  });
}

function render() {
  const rows = [];
  const usdtToTry = usdtTryBid && isFinite(usdtTryBid) ? usdtTryBid : null;
  
  for (const sym of watched) {
    const d = priceData[sym];
    if (!d) continue;
    
    const paribuBid = d.paribuBid;
    const paribuAsk = d.paribuAsk;
    const binanceBid = d.binanceBid;
    const binanceAsk = d.binanceAsk;
    
    if (!isFinite(paribuBid) || !isFinite(paribuAsk)) continue;
    if (!isFinite(binanceBid) || !isFinite(binanceAsk)) continue;
    if (!usdtToTry) continue;
    
    const binanceBidTL = binanceBid * usdtToTry;
    const binanceAskTL = binanceAsk * usdtToTry;
    
    const diff1 = paribuBid - binanceAskTL;
    const diff2 = binanceBidTL - paribuAsk;
    
    if (diff1 <= 0 && diff2 <= 0) continue;
    
    let low, high, pct, lowSrc, highSrc, action, actionPrice;
    
    if (diff1 > diff2) {
      pct = (diff1 / binanceAskTL) * 100;
      low = binanceAskTL;
      high = paribuBid;
      lowSrc = 'Binance';
      highSrc = 'Paribu';
      action = 'SAT';
      actionPrice = paribuBid;
    } else {
      pct = (diff2 / paribuAsk) * 100;
      low = paribuAsk;
      high = binanceBidTL;
      lowSrc = 'Paribu';
      highSrc = 'Binance';
      action = 'AL';
      actionPrice = paribuAsk;
    }
    
    if (pct >= minPctFilter) {
      rows.push({ sym, low, high, pct, lowSrc, highSrc, action, actionPrice });
    }
  }
  
  rows.sort((a,b) => b.pct - a.pct);
  drawTable(rows);
  updateHighlight(rows);
  $('#last').textContent = nowStr();
}

function drawTable(rows) {
  const tbody = $('#tbody');
  const frag = document.createDocumentFragment();
  
  for (const r of rows) {
    const tr = document.createElement('tr');
    
    const tdCoin = document.createElement('td');
    tdCoin.className = 'coinCell';
    tdCoin.innerHTML = `<span class="coinSym">${r.sym}</span>`;
    tr.appendChild(tdCoin);
    
    const tdLow = document.createElement('td');
    tdLow.className = 'mono alCell';
    tdLow.textContent = fmt4(r.low);
    tdLow.style.background = r.lowSrc === 'Binance' ? '#b45309' : '#15803d';
    tr.appendChild(tdLow);
    
    const tdHigh = document.createElement('td');
    tdHigh.className = 'mono satCell';
    tdHigh.textContent = fmt4(r.high);
    tdHigh.style.background = r.highSrc === 'Paribu' ? '#15803d' : '#b45309';
    tr.appendChild(tdHigh);
    
    const tdPct = document.createElement('td');
    tdPct.className = 'mono pctCell';
    tdPct.textContent = fmtPct(r.pct);
    tr.appendChild(tdPct);
    
    frag.appendChild(tr);
  }
  
  tbody.innerHTML = '';
  tbody.appendChild(frag);
}

function updateHighlight(rows) {
  if (!rows.length) {
    $('#hiCoin').textContent = '—';
    $('#hiAct').textContent = '— • —';
    $('#hiPrice').textContent = '—';
    $('#hiPct').textContent = '—';
    return;
  }
  
  const r = rows[0];
  $('#hiCoin').textContent = r.sym;
  $('#hiAct').textContent = `PARİBU • ${r.action}`;
  $('#hiPrice').textContent = `${fmtTR(r.actionPrice, 2)} TL`;
  $('#hiPct').textContent = fmtPct(r.pct);
}

// ====== UI ======
function applyTheme(mode) {
  document.documentElement.className = mode === 'light' ? 'theme-light' : 'theme-dark';
  $('#themeSel').value = mode;
  LS.set('arbi:theme', mode);
}

function renderChips() {
  const wrap = $('#chips');
  wrap.innerHTML = '';
  for (const sym of [...watched].sort()) {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span>${sym}</span>`;
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.onclick = () => {
      removeCoin(sym);
      renderChips();
    };
    chip.appendChild(btn);
    wrap.appendChild(chip);
  }
  $('#cnt').textContent = watched.size;
}

// ====== Events ======
$('#add').onclick = () => {
  const val = $('#coinIn').value;
  const syms = val.split(/[,\s]+/).map(s => norm(s)).filter(s => s);
  
  let addedAny = false;
  for (const sym of syms) {
    if (addCoin(sym)) addedAny = true;
  }
  
  if (addedAny) renderChips();
  $('#coinIn').value = '';
};

$('#coinIn').onkeydown = (e) => { if (e.key === 'Enter') $('#add').click(); };

$('#clear').onclick = () => {
  watched.clear();
  for (const k in priceData) delete priceData[k];
  LS.set('arbi:watched', []);
  
  cleanupParibu();
  cleanupBinance();
  updateStatusUI('paribu', 'disconnected');
  updateStatusUI('binance', 'disconnected');
  
  renderChips();
  $('#tbody').innerHTML = '';
  log('Tüm coinler temizlendi');
};

$('#minPct').oninput = (e) => {
  minPctFilter = Number(e.target.value) || 0;
  LS.set('arbi:minpct', minPctFilter);
  render();
};

$('#themeSel').onchange = (e) => applyTheme(e.target.value);

$('#speedSel').onchange = (e) => {
  updateSpeed = e.target.value;
  LS.set('arbi:speed', updateSpeed);
  log(`Hız değişti: ${updateSpeed}ms - Paribu yeniden bağlanıyor...`, 'warn');
  
  // Hız değişince Paribu reconnect gerekli
  cleanupParibu();
  setTimeout(() => connectParibu(), 100);
};

$('#reconnect').onclick = () => {
  log('Manuel yeniden bağlanma...');
  wsState.paribu.attempts = 0;
  wsState.binance.attempts = 0;
  
  cleanupParibu();
  cleanupBinance();
  
  setTimeout(() => {
    connectParibu();
    connectBinance();
  }, 100);
};

// Update counter per second
setInterval(() => {
  $('#updateCount').textContent = updateCounter;
  updateCounter = 0;
  
  // Uptime
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;
  $('#uptime').textContent = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
}, 1000);

// ====== Init ======
log('Arbitraj Radarı başlatılıyor...');
applyTheme(themeMode);
$('#minPct').value = minPctFilter;
$('#speedSel').value = updateSpeed;
renderChips();

// İlk bağlantı
setTimeout(() => {
  connectParibu();
  connectBinance();
}, 100);
</script>
</body>
</html>
